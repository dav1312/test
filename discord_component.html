  <style>
    :root {
      --bg: #0f1115;

      margin: 0;
      padding: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

<body>
  <main>
    <h1>Dicord Component Embeds Testing Endpoint</h1>
    <p>This page contains an inline <code>discord:component-embed</code> payload and Open Graph metadata in its <code>&lt;head&gt;</code>.</p>
    <p>Inspect payload validation and parser errors using the official <a href="https://discord.com/developers/embeds" target="_blank" rel="noopener noreferrer">Discord Embed Debugger</a>.</p>

    <p>Current embedded JSON payload:</p>
    <pre id="json-viewer"></pre>
  </main>

  <script>
    const payload = document.getElementById('discord:component-embed').textContent;
    try {
      document.getElementById('json-viewer').textContent = JSON.stringify(JSON.parse(payload), null, 2);
    } catch (e) {
      document.getElementById('json-viewer').textContent = payload.trim();
    }
  </script>
</body>
