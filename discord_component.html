<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Component Embed Creator</title>

  </script>

  <style>
    :root {
      --bg: #1e1f22;
      --panel-bg: #2b2d31;
      --card-bg: #313338;
      --input-bg: #1e1f22;
      --border: #3f4147;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --danger: #da373c;
      --danger-hover: #a1282c;
      --text: #dbdee1;
      --heading: #f2f3f5;
      --muted: #949ba4;
      --code-color: #58a6ff;

      /* Discord Native Design Tokens */
      --d-chat-bg: #323339;
      --d-embed-bg: #393a41;
      --d-embed-border: #44454c;
      --d-text-normal: #f3f3f4;
      --d-text-heading: #fff;
      --d-text-muted: #949ba4;
      --d-btn-bg: #44454c;
      --d-btn-hover: #484951;
      --d-link: #76aff6;
      --d-code-bg: #1e1f22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "gg sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; color: var(--heading); font-weight: 700; }
    header .header-actions { display: flex; align-items: center; gap: 12px; }
    header .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
    header .links a:hover { color: var(--heading); }

    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left: Editor */
    .editor-pane {
      width: 50%;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background-color: var(--panel-bg);
    }
    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Right: Preview Pane (Split: Visualizer Top / JSON Bottom) */
    .preview-pane {
      width: 50%;
      display: flex;
      flex-direction: column;
      background: #111214;
      overflow: hidden;
    }

    /* Top: Visual Visualizer */
    .visual-preview-section {
      flex: 1 1 54%;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid var(--border);
      background: var(--d-chat-bg);
      overflow: hidden;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #18191c;
      border-bottom: 1px solid var(--border);
    }
    .preview-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--heading);
    }
    .preview-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .visual-preview-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      background-color: var(--d-chat-bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Bottom: JSON Output */
    .json-section {
      flex: 1 1 46%;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      background: #111214;
      overflow: hidden;
    }
    .output-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #18191c;
      border-bottom: 1px solid var(--border);
    }
    .status-stats {
      display: flex;
      gap: 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .status-stats span strong { color: var(--heading); }
    .status-stats span.limit-exceeded strong { color: var(--danger); }
    .code-container {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    pre.raw-json {
      font-family: "gg mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--code-color);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Form Controls */
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--heading);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--heading);
      cursor: pointer;
      text-transform: none;
      margin-top: 6px;
    }

    /* Cards */
    .component-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--heading);
    }
    .component-actions { display: flex; gap: 6px; }

    /* Buttons */
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: transparent; color: var(--danger); }
    .btn-danger:hover { background: rgba(218, 55, 60, 0.15); }
    .btn-subtle { background: var(--border); color: var(--heading); }
    .btn-subtle:hover { background: #4e5058; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .sub-item-box {
      background: var(--input-bg);
      border: 1px dashed var(--border);
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    /* ==========================================================================
       DISCORD NATIVE EMULATOR STYLES
       ========================================================================== */
    /* Type 17 Root Container */
    .d-embed-wrapper {
      position: relative;
      width: 100%;
      max-width: min(600px, 100%);
    }
    .d-embed-container {
      background: var(--d-embed-bg);
      border: 1px solid var(--d-embed-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      padding: 16px;
      position: relative;
      width: 100%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    .d-embed-container::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline-start: 0;
      width: 4px;
      height: 100%;
      background-color: var(--d-accent-color, #5865f2);
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }

    /* Container Spoilers */
    .d-spoiler-root .d-embed-container {
      filter: blur(28px);
      user-select: none;
      pointer-events: none;
    }
    .d-spoiler-root.revealed .d-embed-container {
      filter: none;
      user-select: auto;
      pointer-events: auto;
    }
    .d-spoiler-mask-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-spoiler-root.revealed .d-spoiler-mask-overlay {
      display: none;
    }
    .d-spoiler-badge-large {
      background: rgba(0, 0, 0, 0.75);
      color: #f2f3f5;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Type 10 Text Markdown */
    .d-type-text {
      font-size: 0.875rem;
      line-height: 1.375;
      color: var(--d-text-normal);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .d-h1 { font-size: 1.3rem; font-weight: 700; color: var(--d-text-heading); margin: 6px 0 2px; }
    .d-h2 { font-size: 1.15rem; font-weight: 700; color: var(--d-text-heading); margin: 6px 0 2px; }
    .d-h3 { font-size: 1rem; font-weight: 700; color: var(--d-text-heading); margin: 4px 0 2px; }
    .d-h1:first-child, .d-h2:first-child, .d-h3:first-child { margin-top: 0; }
    .d-subtext { font-size: 0.75rem; color: var(--d-text-muted); display: block; }
    .d-link { color: var(--d-link); text-decoration: none; word-break: break-word; }
    .d-link:hover { text-decoration: underline; }

    /* Discord Lists */
    .d-list {
      margin: 4px 0;
      padding-left: 20px;
      white-space: normal;
    }
    .d-list-ul {
      list-style-type: disc;
    }
    .d-list-ul .d-list-ul {
      list-style-type: circle;
    }
    .d-list-ol {
      list-style-type: decimal;
    }
    .d-list li {
      margin: 2px 0;
      line-height: 1.375;
      color: var(--d-text-normal);
      word-break: break-word;
    }
    .d-list li > .d-list {
      margin: 2px 0 0 0;
    }

    /* Blockquotes */
    .d-blockquote-container {
      display: flex;
      margin: 4px 0;
    }
    .d-blockquote-divider {
      width: 4px;
      min-width: 4px;
      border-radius: 4px;
      background-color: #4e5058;
      margin-right: 8px;
    }
    .d-blockquote-container blockquote {
      color: var(--d-text-normal);
      font-size: 0.875rem;
      line-height: 1.375;
      margin: 0;
      padding: 0;
    }

    /* Inline & Blocks Code */
    .d-inline-code {
      background: var(--d-code-bg);
      border: 1px solid #232428;
      border-radius: 3px;
      font-family: "gg mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 85%;
      padding: 1px 4px;
      color: #dbdee1;
      word-break: break-word;
    }
    .d-code-block-container {
      background: var(--d-code-bg);
      border: 1px solid #232428;
      border-radius: 4px;
      margin: 6px 0;
      overflow: hidden;
    }
    pre.d-code-block {
      padding: 8px 12px;
      margin: 0;
      overflow-x: auto;
      font-family: "gg mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      color: #dbdee1;
      white-space: pre-wrap;
    }

    /* Text Spoilers */
    .d-spoiler {
      background-color: #232428;
      color: transparent;
      border-radius: 3px;
      padding: 0 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, color 0.15s;
    }
    .d-spoiler.revealed {
      background-color: rgba(255, 255, 255, 0.1);
      color: inherit;
      user-select: auto;
    }

    /* Custom & Inline Emojis */
    .d-custom-emoji {
      width: 22px;
      height: 22px;
      vertical-align: -4px;
      object-fit: contain;
      margin: 0 1px;
    }
    .d-btn-emoji {
      width: 1.375em;
      height: 1.375em;
      object-fit: contain;
      flex-shrink: 0;
      margin-inline-end: 4px;
    }
    .d-btn-unicode-emoji {
      margin-inline-end: 4px;
    }

    /* Type 9: Section */
    .d-type-section {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
    }
    .d-section-body {
      flex: 1;
      min-width: 0;
      font-size: 0.875rem;
      line-height: 1.375;
      color: var(--d-text-normal);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .d-section-accessory {
      flex-shrink: 0;
    }
    .d-section-accessory-thumb {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .d-section-accessory-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .d-spoiler-thumb img {
      filter: blur(44px);
      cursor: pointer;
    }
    .d-spoiler-thumb.revealed img { filter: none; }
    .d-spoiler-tag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      pointer-events: none;
    }
    .d-spoiler-thumb.revealed .d-spoiler-tag { display: none; }

    /* Type 12: Media Gallery */
    .d-type-gallery {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }
    .d-gallery-1 {
      display: block;
      max-height: 350px;
    }
    .d-gallery-1 .d-gallery-item {
      width: 100%;
      max-height: 350px;
    }
    .d-gallery-1 img, .d-gallery-1 video {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }
    .d-gallery-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 220px;
    }
    .d-gallery-3 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      height: 260px;
    }
    .d-gallery-3 .d-gallery-item:first-child {
      grid-row: 1 / span 2;
    }
    .d-gallery-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      height: 260px;
    }
    .d-gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      height: 100%;
      width: 100%;
    }
    .d-gallery-item img, .d-gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .d-spoiler-media img, .d-spoiler-media video {
      filter: blur(44px);
      cursor: pointer;
    }
    .d-spoiler-media.revealed img, .d-spoiler-media.revealed video { filter: none; }
    .d-spoiler-badge-media {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .d-spoiler-media.revealed .d-spoiler-badge-media { display: none; }

    /* Type 1: Action Row & Type 2: Link Button */
    .d-type-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .d-button {
      align-items: center;
      background-color: var(--d-btn-bg);
      border: 1px solid #97979f0a;
      border-radius: 8px;
      color: #ffffff;
      display: inline-flex;
      font-size: 14px;
      font-weight: 500;
      justify-content: center;
      line-height: 16px;
      min-height: 32px;
      padding: 3px 11px;
      text-decoration: none;
      transition: background-color 0.17s ease;
      cursor: pointer;
      user-select: none;
    }
    .d-button:hover {
      background-color: var(--d-btn-hover);
      text-decoration: none;
    }
    .d-button.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }
    .d-btn-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .d-launch-icon {
      flex-shrink: 0;
      opacity: 0.85;
      margin-inline-start: 8px;
    }

    /* Type 14: Separator */
    .d-type-separator hr {
      border: 0;
      height: 1px;
      background-color: var(--border);
      margin: 4px 0;
    }

    .d-empty-embed {
      padding: 24px;
      text-align: center;
      color: var(--d-text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* Modal for Import JSON */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 90%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .modal-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1rem; color: var(--heading); }
    .modal-body { padding: 16px 18px; }
    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Discord Component Embed Creator</h1>
    <div class="header-actions">
      <button class="btn-subtle" id="btn-open-import">Import JSON</button>

    <div class="editor-pane">

      <div class="section-box">
        <div class="section-title">Root Container (Type 17)</div>

          <div class="col form-group">
            <label for="containerColorPicker">Accent Color</label>

              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span>Live Discord Visualizer</span>

      <!-- Bottom Window: Live JSON Preview & Export -->

  <!-- Import Modal -->
  <div id="import-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Import Discord Component Payload</h3>
        <button class="btn-danger" id="btn-close-import">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.82rem; color: var(--muted); margin-bottom: 10px;">
          Paste raw JSON payload (supports <code>{"embeds": [...]}</code>, <code>{"component": {...}}</code>, or <code>{"type": 17, ...}</code>).
        </p>
        <textarea id="import-json-input" placeholder="Paste JSON here..." style="min-height: 180px; font-family: monospace;"></textarea>
        <div id="import-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 6px; display: none;"></div>
      </div>

        <button class="btn-primary" id="btn-apply-import">Load Payload</button>

  <script>
    (() => {
      'use strict';

      // --- Utilities ---
      const hexToInt = (hex) => parseInt(hex.replace(/^#/, ''), 16) || 0;
      const intToHex = (num) => '#' + (num || 0).toString(16).padStart(6, '0').toUpperCase();
      const escapeAttr = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      const escapeHtml = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Safe deep path mutator: setByPath(state, 'components.0.content', 'hello')
      function setByPath(obj, path, value) {
        const segments = path.split('.');
        const last = segments.pop();
        let target = obj;
        for (const seg of segments) {
          if (target[seg] == null) {
            target[seg] = {};
          }
          target = target[seg];
        }
        target[last] = value;
      }

      function getByPath(obj, path) {
        return path.split('.').reduce((acc, seg) => acc?.[seg], obj);
      }

      // --- Nested List Parser for Discord Markdown ---
      function parseLists(text) {
        const lines = text.split('\n');
        const outputLines = [];
        let inList = false;
        let listStack = [];
        let currentListHtml = '';

        function closeListsUntil(targetIndent, nextType) {
          let out = '';
          while (listStack.length > 0) {
            const top = listStack[listStack.length - 1];
            if (top.indent > targetIndent) {
              out += '</li></' + top.type + '>';
              listStack.pop();
            } else if (top.indent === targetIndent && nextType && top.type !== nextType) {
              out += '</li></' + top.type + '>';
              listStack.pop();
            } else {
              break;
            }
          }
          return out;
        }

        function closeAllLists() {
          let out = '';
          while (listStack.length > 0) {
            const top = listStack.pop();
            out += '</li></' + top.type + '>';
          }
          inList = false;
          return out;
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const match = line.match(/^([ \t]*)(?:([-*+])|(\d+)\.)[ \t]+(.*)$/);

          if (match) {
            const rawIndent = match[1].replace(/\t/g, '  ').length;
            const isOrdered = match[3] !== undefined;
            const type = isOrdered ? 'ol' : 'ul';
            const startNum = isOrdered ? parseInt(match[3], 10) : null;
            const content = match[4];
            const startAttr = (isOrdered && startNum !== 1) ? ` start="${startNum}"` : '';
            const valueAttr = isOrdered ? ` value="${startNum}"` : '';

            if (!inList) {
              inList = true;
              listStack = [{ type, indent: rawIndent }];
              currentListHtml = `<${type} class="d-list d-list-${type}"${startAttr}><li${valueAttr}>${content}`;
            } else {
              const top = listStack[listStack.length - 1];
              if (rawIndent > top.indent) {
                listStack.push({ type, indent: rawIndent });
                currentListHtml += `<${type} class="d-list d-list-${type}"${startAttr}><li${valueAttr}>${content}`;
              } else if (rawIndent === top.indent) {
                if (type === top.type) {
                  currentListHtml += `</li><li${valueAttr}>${content}`;
                } else {
                  currentListHtml += closeListsUntil(rawIndent, type);
                  listStack.push({ type, indent: rawIndent });
                  currentListHtml += `<${type} class="d-list d-list-${type}"${startAttr}><li${valueAttr}>${content}`;
                }
              } else {
                currentListHtml += closeListsUntil(rawIndent, type);
                if (listStack.length > 0 && listStack[listStack.length - 1].indent === rawIndent && listStack[listStack.length - 1].type === type) {
                  currentListHtml += `</li><li${valueAttr}>${content}`;
                } else {
                  listStack.push({ type, indent: rawIndent });
                  currentListHtml += `<${type} class="d-list d-list-${type}"${startAttr}><li${valueAttr}>${content}`;
                }
              }
            }
          } else {
            if (inList) {
              currentListHtml += closeAllLists();
              outputLines.push(currentListHtml);
              currentListHtml = '';
            }
            outputLines.push(line);
          }
        }

        if (inList) {
          currentListHtml += closeAllLists();
          outputLines.push(currentListHtml);
        }

        return outputLines.join('\n');
      }

      // --- Discord Markdown Parser ---
      function parseDiscordMarkdown(md) {
        if (!md) return '';

        // 1. Extract code blocks ```lang ... ```
        const codeBlocks = [];
        let text = md.replace(/```[ \t]*(?:([a-zA-Z0-9_+-]+)[ \t]*\r?\n|\r?\n)?([\s\S]*?)```/g, (match, lang, code) => {
          const id = `\uE000CODEBLOCK${codeBlocks.length}\uE000`;
          codeBlocks.push({ lang: lang || '', code: code.replace(/\r?\n$/, '') });
          return id;
        });

        // 2. Extract inline code `...`
        const inlineCodes = [];
        text = text.replace(/`([^`\n]+)`/g, (match, code) => {
          const id = `\uE000INLINECODE${inlineCodes.length}\uE000`;
          inlineCodes.push(code);
          return id;
        });

        // 3. Escape HTML
        text = escapeHtml(text);

        // 4. Custom Discord Emojis: <:name:id> or <a:name:id>
        text = text.replace(/&lt;(a)?:([a-zA-Z0-9_]{2,32}):(\d{17,21})&gt;/g, (match, animated, name, id) => {
          const ext = animated ? 'gif' : 'webp';
          return `<img class="d-custom-emoji" src="https://cdn.discordapp.com/emojis/${id}.${ext}?size=44&quality=lossless" alt=":${name}:" title=":${name}:" draggable="false" />`;
        });

        // 5. Discord Timestamps: <t:1726760000:R>
        text = text.replace(/&lt;t:(\d+)(?::([tTdDfFR]))?&gt;/g, (match, ts) => {
          const d = new Date(parseInt(ts, 10) * 1000);
          return `<span class="d-timestamp" title="${d.toLocaleString()}">${d.toLocaleDateString()}</span>`;
        });

        // 6. Subtext: -# text (with optional leading indentation)
        text = text.replace(/^[ \t]*-\# (.*)$/gm, '<small class="d-subtext">$1</small>');

        // 7. Multi-line blockquote: >>> and Single-line blockquote: >
        const multiQuoteMatch = text.match(/(?:^|\n)&gt;&gt;&gt; ([\s\S]*)$/);
        if (multiQuoteMatch) {
          const beforeQuote = text.substring(0, multiQuoteMatch.index);
          const quoteContent = multiQuoteMatch[1];
          text = beforeQuote + '<div class="d-blockquote-container"><div class="d-blockquote-divider"></div><blockquote>\n' + quoteContent + '\n</blockquote></div>';
        } else {
          text = text.replace(/(?:^|\n)&gt; (?:.*)(?:\n&gt; .*)*/g, (match) => {
            const hasLeadingNewline = match.startsWith('\n');
            const lines = match.trimStart().split('\n')
              .map(l => l.replace(/^&gt; ?/, ''))
              .join('\n');
            const prefix = hasLeadingNewline ? '\n' : '';
            return `${prefix}<div class="d-blockquote-container"><div class="d-blockquote-divider"></div><blockquote>\n${lines}\n</blockquote></div>`;
          });
        }

        // 8. Headers (#, ##, ###)
        text = text.replace(/^### (.*)$/gm, '<h3 class="d-h3">$1</h3>');
        text = text.replace(/^## (.*)$/gm, '<h2 class="d-h2">$1</h2>');
        text = text.replace(/^# (.*)$/gm, '<h1 class="d-h1">$1</h1>');

        // 9. Bullets and Ordered Lists
        text = parseLists(text);

        // 10. Links: [text](url)
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a class="d-link" href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // 11. Text formatting: bold, italic, underline, strikethrough, spoiler
        // Underline
        text = text.replace(/(?<!_)__(?!_)([^\n_]+?)(?<!_)__(?!_)/g, '<u>$1</u>');

        // Compound Bold + Italic combinations (solves **bold / *italic*** and *italic / **bold***)
        text = text.replace(/(?<!\*)\*\*\*(?!\*)([^\n]+?)(?<!\*)\*\*\*(?!\*)/g, '<strong><em>$1</em></strong>');
        text = text.replace(/(?<!\*)\*\*(?!\*)([^\n*]+?)(?<!\*)\*(?!\*)([^\n*]+?)(?<!\*)\*\*\*(?!\*)/g, '<strong>$1<em>$2</em></strong>');
        text = text.replace(/(?<!\*)\*(?!\*)([^\n*]+?)(?<!\*)\*\*(?!\*)([^\n*]+?)(?<!\*)\*\*\*(?!\*)/g, '<em>$1<strong>$2</strong></em>');
        text = text.replace(/(?<!\*)\*\*\*(?!\*)([^\n*]+?)(?<!\*)\*(?!\*)([^\n*]+?)(?<!\*)\*\*(?!\*)/g, '<strong><em>$1</em>$2</strong>');
        text = text.replace(/(?<!\*)\*\*\*(?!\*)([^\n*]+?)(?<!\*)\*\*(?!\*)([^\n*]+?)(?<!\*)\*(?!\*)/g, '<em><strong>$1</strong>$2</em>');

        // Standard Bold
        text = text.replace(/(?<!\*)\*\*(?!\*)([^\n]+?)(?<!\*)\*\*(?!\*)/g, '<strong>$1</strong>');

        // Standard Italic (* and _)
        text = text.replace(/(?<!\*)\*(?!\*)([^\n*]+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
        text = text.replace(/(?<!_)_(?!_)([^\n_]+?)(?<!_)_(?!_)/g, '<em>$1</em>');

        // Strikethrough & Spoiler
        text = text.replace(/~~([^\n~]+?)~~/g, '<s>$1</s>');
        text = text.replace(/\|\|([\s\S]*?)\|\|/g, '<span class="d-spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');

        // 12. Newlines conversion & block boundary cleanup
        text = text.replace(/\n/g, '<br>');
        text = text.replace(/<\/(h[1-3]|div|blockquote|ul|ol)><br>/g, '</$1>');
        text = text.replace(/<br><(h[1-3]|div|blockquote|ul|ol)/g, '<$1');
        text = text.replace(/<br><div class="d-blockquote-container">/g, '<div class="d-blockquote-container">');

        // 13. Restore Inline Codes
        text = text.replace(/\uE000INLINECODE(\d+)\uE000/g, (_, idx) => {
          const c = inlineCodes[idx] || '';
          return `<code class="d-inline-code">${escapeHtml(c)}</code>`;
        });

        // 14. Restore Code Blocks
        text = text.replace(/(?:<br>)?\uE000CODEBLOCK(\d+)\uE000(?:<br>)?/g, (_, idx) => {
          const item = codeBlocks[idx];
          if (!item) return '';
          return `<div class="d-code-block-container"><pre class="d-code-block"><code>${escapeHtml(item.code)}</code></pre></div>`;
        });

        return text;
      }

      // --- Component Registry (Single Source of Truth for Descriptors) ---
      const REGISTRY = {
        10: {
          key: 'text',
          name: 'Text Display',
          type: 10,
          create: () => ({ type: 10, content: 'New Markdown text content.' }),
          render: (comp, path) => `
            <div class="form-group">
              <label>Markdown Content</label>
              <textarea data-path="${path}.content">${escapeHtml(comp.content || '')}</textarea>
            </div>
          `
        },
        9: {
          key: 'section',
          name: 'Section',
          type: 9,
          create: () => ({
            type: 9,
            components: [{ type: 10, content: 'Section headline and body.' }],
            accessory: {
              type: 2,
              style: 5,
              url: 'https://discord.com',
              label: 'Open',
              emoji: { name: '' }
            }
          }),
          render: (comp, path) => {
            const textContent = comp.components?.[0]?.content || '';
            const acc = comp.accessory;
            const accType = !acc ? 'none' : acc.type === 11 ? 'thumbnail' : 'button';

            let accessoryHtml = '';
            if (accType === 'button') {
              accessoryHtml = `
                <div class="sub-item-box">
                  <div class="row" style="flex-wrap: wrap;">
                    <div class="col form-group" style="flex: 0 0 100px;">
                      <label>Emoji</label>
                      <input type="text" placeholder="🚀 or name:id" value="${escapeAttr(acc?.emoji?.name || '')}" data-emoji-target="${path}.accessory.emoji" data-path="${path}.accessory.emoji.name" />
                    </div>
                    <div class="col form-group" style="flex: 0 0 140px;">
                      <label>Emoji ID</label>
                      <input type="text" placeholder="Optional ID" value="${escapeAttr(acc?.emoji?.id || '')}" data-emoji-id-target="${path}.accessory.emoji" data-path="${path}.accessory.emoji.id" />
                    </div>
                    <div class="col form-group" style="flex: 1 1 120px;">
                      <label>Button Label</label>
                      <input type="text" value="${escapeAttr(acc?.label || '')}" data-path="${path}.accessory.label" />
                    </div>
                    <div class="col form-group" style="flex: 1 1 160px;">
                      <label>Link URL</label>
                      <input type="text" value="${escapeAttr(acc?.url || '')}" data-path="${path}.accessory.url" />
                    </div>
                  </div>
                </div>
              `;
            } else if (accType === 'thumbnail') {
              accessoryHtml = `
                <div class="sub-item-box">
                  <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" value="${escapeAttr(acc?.media?.url || '')}" data-path="${path}.accessory.media.url" />
                  </div>
                  <label class="checkbox-label">
                    <input type="checkbox" ${acc?.spoiler ? 'checked' : ''} data-path="${path}.accessory.spoiler" data-type="boolean" />
                    Spoiler Mask Thumbnail
                  </label>
                </div>
              `;
            }

            return `
              <div class="form-group">
                <label>Section Text (Markdown)</label>
                <textarea data-path="${path}.components.0.content">${escapeHtml(textContent)}</textarea>
              </div>
              <div class="row">
                <div class="col form-group">
                  <label>Accessory Type</label>
                  <select data-action="change-accessory" data-path="${path}">
                    <option value="none" ${accType === 'none' ? 'selected' : ''}>None</option>
                    <option value="button" ${accType === 'button' ? 'selected' : ''}>Link Button (2)</option>
                    <option value="thumbnail" ${accType === 'thumbnail' ? 'selected' : ''}>Thumbnail (11)</option>
                  </select>
                </div>
              </div>
              ${accessoryHtml}
            `;
          }
        },
        12: {
          key: 'gallery',
          name: 'Media Gallery',
          type: 12,
          create: () => ({
            type: 12,
            items: [{ media: { url: 'https://upload.wikimedia.org/wikipedia/commons/2/22/Blue-green-gradient.jpg' }, description: '', spoiler: false }]
          }),
          render: (comp, path) => `
            <div class="form-group">
              <label>Gallery Items</label>
              ${(comp.items || []).map((item, i) => `
                <div class="sub-item-box">
                  <div class="row" style="flex-wrap: wrap;">
                    <div class="col form-group" style="flex: 2 1 200px;">
                      <label>Media URL</label>
                      <input type="text" value="${escapeAttr(item.media?.url || '')}" data-path="${path}.items.${i}.media.url" />
                    </div>
                    <div class="col form-group" style="flex: 1 1 140px;">
                      <label>Alt Text</label>
                      <input type="text" value="${escapeAttr(item.description || '')}" data-path="${path}.items.${i}.description" />
                    </div>
                    <div style="display: flex; align-items: flex-end; padding-bottom: 12px; gap: 8px;">
                      <label class="checkbox-label" style="margin-top: 0; white-space: nowrap;">
                        <input type="checkbox" ${item.spoiler ? 'checked' : ''} data-path="${path}.items.${i}.spoiler" data-type="boolean" />
                        Spoiler
                      </label>
                      <button class="btn-danger" data-action="delete-array-item" data-path="${path}.items" data-index="${i}">&times;</button>
                    </div>
                  </div>
                </div>
              `).join('')}
              <button class="btn-subtle" data-action="add-gallery-item" data-path="${path}">+ Add Media Item</button>
            </div>
          `
        },
        1: {
          key: 'row',
          name: 'Action Row',
          type: 1,
          create: () => ({
            type: 1,
            components: [{
              type: 2,
              style: 5,
              url: 'https://discord.com',
              label: 'Visit',
              emoji: { name: '' },
              disabled: false
            }]
          }),
          render: (comp, path) => `
            <div class="form-group">
              <label>Action Row Buttons</label>
              ${(comp.components || []).map((btn, b) => `
                <div class="sub-item-box">
                  <div class="row" style="flex-wrap: wrap;">
                    <div class="col form-group" style="flex: 0 0 100px;">
                      <label>Emoji</label>
                      <input type="text" placeholder="🚀 or name:id" value="${escapeAttr(btn.emoji?.name || '')}" data-emoji-target="${path}.components.${b}.emoji" data-path="${path}.components.${b}.emoji.name" />
                    </div>
                    <div class="col form-group" style="flex: 0 0 140px;">
                      <label>Emoji ID</label>
                      <input type="text" placeholder="Optional ID" value="${escapeAttr(btn.emoji?.id || '')}" data-emoji-id-target="${path}.components.${b}.emoji" data-path="${path}.components.${b}.emoji.id" />
                    </div>
                    <div class="col form-group" style="flex: 1 1 120px;">
                      <label>Label</label>
                      <input type="text" value="${escapeAttr(btn.label || '')}" data-path="${path}.components.${b}.label" />
                    </div>
                    <div class="col form-group" style="flex: 1 1 160px;">
                      <label>URL</label>
                      <input type="text" value="${escapeAttr(btn.url || '')}" data-path="${path}.components.${b}.url" />
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end; padding-bottom: 12px;">
                      <label class="checkbox-label">
                        <input type="checkbox" ${btn.disabled ? 'checked' : ''} data-path="${path}.components.${b}.disabled" data-type="boolean" /> Disabled
                      </label>
                    </div>
                    <div style="display: flex; align-items: flex-end; padding-bottom: 12px;">
                      <button class="btn-danger" data-action="delete-array-item" data-path="${path}.components" data-index="${b}">&times;</button>
                    </div>
                  </div>
                </div>
              `).join('')}
              <button class="btn-subtle" data-action="add-row-button" data-path="${path}">+ Add Button</button>
            </div>
          `
        },
        14: {
          key: 'separator',
          name: 'Separator',
          type: 14,
          create: () => ({ type: 14 }),
          render: () => ''
        }
      };

      // --- Canonical Initialization ---
      function loadInitialState() {
        const headScript = document.getElementById('discord:component-embed');
        if (headScript) {
          try {
            const parsed = JSON.parse(headScript.textContent.trim());
            if (parsed?.component?.type === 17) {
              return parsed.component;
            }
          } catch (err) {
            console.error('Failed to parse #discord:component-embed payload, falling back to defaults:', err);
          }
        }
        return {
          type: 17,
          accent_color: 5793266,
          spoiler: false,
          components: []
        };
      }

      let rootContainer = loadInitialState();
      rootContainer.accent_color = rootContainer.accent_color ?? 5793266;
      rootContainer.spoiler = !!rootContainer.spoiler;
      rootContainer.components = rootContainer.components || [];

      // --- Spec-Compliant Component Counting ---
      function countComponents(root) {
        let count = 1; // Root type 17
        for (const c of root.components) {
          count++;
          if (c.type === 9) {
            if (c.components?.length) count += c.components.length;
            if (c.accessory) count++;
          } else if (c.type === 1) {
            if (c.components?.length) count += c.components.length;
          }
        }
        return count;
      }

      // --- DOM Elements ---
      const listContainer = document.getElementById('components-list');
      const addToolbar = document.getElementById('add-toolbar');
      const jsonOutput = document.getElementById('json-output');
      const statCount = document.getElementById('stat-count');
      const statCountWrapper = document.getElementById('stat-count-wrapper');
      const statSize = document.getElementById('stat-size');
      const minifyCheckbox = document.getElementById('minify-json');
      const colorPicker = document.getElementById('containerColorPicker');
      const colorHex = document.getElementById('containerColorHex');
      const spoilerCheckbox = document.getElementById('containerSpoiler');
      const btnCopyJson = document.getElementById('btn-copy-json');
      const btnCopyScript = document.getElementById('btn-copy-script');
      const visualPreviewContainer = document.getElementById('visual-preview-container');
      const btnResetSpoilers = document.getElementById('btn-reset-spoilers');

      // Modal Elements
      const btnOpenImport = document.getElementById('btn-open-import');
      const importModal = document.getElementById('import-modal');
      const btnCloseImport = document.getElementById('btn-close-import');
      const btnCancelImport = document.getElementById('btn-cancel-import');
      const btnApplyImport = document.getElementById('btn-apply-import');
      const importJsonInput = document.getElementById('import-json-input');
      const importError = document.getElementById('import-error');

      // --- Serialization & Sync ---
      function cleanComponent(obj) {
        if (Array.isArray(obj)) {
          return obj.map(cleanComponent);
        }
        if (obj !== null && typeof obj === 'object') {
          const cleaned = {};
          for (const [key, value] of Object.entries(obj)) {
            if (key === 'spoiler' && value === false) continue;
            if (key === 'disabled' && value === false) continue;
            if (obj.type === 14 && key === 'spacing') continue;
            if (value === undefined) continue;
            cleaned[key] = cleanComponent(value);
          }
          return cleaned;
        }
        return obj;
      }

      function getCleanPayload() {
        return { component: cleanComponent(rootContainer) };
      }

      function getFormattedJson() {
        const payload = getCleanPayload();
        return minifyCheckbox.checked
          ? JSON.stringify(payload)
          : JSON.stringify(payload, null, 2);
      }

      // --- Visualizer Renderer Helper Functions ---
      function renderButtonHtml(btn) {
        if (!btn) return '';
        const isCustomEmoji = !!btn.emoji?.id;
        const emojiName = btn.emoji?.name || '';
        const emojiId = btn.emoji?.id || '';

        let emojiTag = '';
        if (isCustomEmoji) {
          emojiTag = `<img class="d-btn-emoji" src="https://cdn.discordapp.com/emojis/${emojiId}.webp?size=44&quality=lossless" alt="${escapeAttr(emojiName)}" />`;
        } else if (emojiName) {
          emojiTag = `<span class="d-btn-unicode-emoji">${escapeHtml(emojiName)}</span>`;
        }

        const disabledClass = btn.disabled ? 'disabled' : '';
        const href = btn.disabled ? 'javascript:void(0)' : escapeAttr(btn.url || '#');

        return `
          <a class="d-button ${disabledClass}" href="${href}" target="_blank" rel="noopener noreferrer">
            ${emojiTag}
            <span class="d-btn-label">${escapeHtml(btn.label || '')}</span>
            <svg class="d-launch-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M15 2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0V4.41l-4.3 4.3a1 1 0 1 1-1.4-1.42L19.58 3H16a1 1 0 0 1-1-1Z" clip-rule="evenodd"/>
              <path fill-rule="evenodd" d="M5 2a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-6a1 1 0 1 0-2 0v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6a1 1 0 1 0 0-2H5Z" clip-rule="evenodd"/>
            </svg>
          </a>
        `;
      }

      function renderVisualComponent(comp) {
        if (!comp) return '';

        // Type 10: Text Display
        if (comp.type === 10) {
          return `<div class="d-component d-type-text">${parseDiscordMarkdown(comp.content || '')}</div>`;
        }

        // Type 9: Section
        if (comp.type === 9) {
          const textHtml = (comp.components || []).map(c => parseDiscordMarkdown(c.content || '')).join('');
          let accessoryHtml = '';
          if (comp.accessory) {
            if (comp.accessory.type === 11) {
              const isSpoiler = !!comp.accessory.spoiler;
              accessoryHtml = `
                <div class="d-section-accessory-thumb ${isSpoiler ? 'd-spoiler-thumb' : ''}" ${isSpoiler ? 'onclick="this.classList.toggle(\'revealed\')"' : ''}>
                  <img src="${escapeAttr(comp.accessory.media?.url || '')}" alt="Thumbnail" />
                  ${isSpoiler ? '<span class="d-spoiler-tag">SPOILER</span>' : ''}
                </div>
              `;
            } else if (comp.accessory.type === 2) {
              accessoryHtml = renderButtonHtml(comp.accessory);
            }
          }
          return `
            <div class="d-component d-type-section">
              <div class="d-section-body">${textHtml}</div>
              ${accessoryHtml ? `<div class="d-section-accessory">${accessoryHtml}</div>` : ''}
            </div>
          `;
        }

        // Type 12: Media Gallery
        if (comp.type === 12) {
          const items = comp.items || [];
          if (items.length === 0) return '';
          const count = items.length;
          const gridClass = count === 1 ? 'd-gallery-1' : count === 2 ? 'd-gallery-2' : count === 3 ? 'd-gallery-3' : 'd-gallery-4';

          const itemsHtml = items.slice(0, 4).map((item) => {
            const url = item.media?.url || '';
            const isVideo = /\.(webm|mp4|mov)(\?.*)?$/i.test(url);
            const isSpoiler = !!item.spoiler;
            const alt = escapeAttr(item.description || 'Media');

            const mediaTag = isVideo
              ? `<video src="${escapeAttr(url)}" controls playsinline poster=""></video>`
              : `<img src="${escapeAttr(url)}" alt="${alt}" loading="lazy" />`;

            return `
              <div class="d-gallery-item ${isSpoiler ? 'd-spoiler-media' : ''}" ${isSpoiler ? 'onclick="this.classList.toggle(\'revealed\')"' : ''}>
                ${mediaTag}
                ${isSpoiler ? '<div class="d-spoiler-badge-media">SPOILER</div>' : ''}
              </div>
            `;
          }).join('');

          return `<div class="d-component d-type-gallery ${gridClass}">${itemsHtml}</div>`;
        }

        // Type 1: Action Row
        if (comp.type === 1) {
          const buttons = comp.components || [];
          const buttonsHtml = buttons.map(btn => renderButtonHtml(btn)).join('');
          return `<div class="d-component d-type-action-row">${buttonsHtml}</div>`;
        }

        // Type 14: Separator
        if (comp.type === 14) {
          return `<div class="d-component d-type-separator"><hr /></div>`;
        }

        return '';
      }

      function renderVisualizer() {
        if (!visualPreviewContainer) return;

        const accentHex = intToHex(rootContainer.accent_color);
        const isContainerSpoiler = !!rootContainer.spoiler;

        const componentsHtml = (rootContainer.components || []).map(comp => renderVisualComponent(comp)).join('');

        visualPreviewContainer.innerHTML = `
          <div class="d-embed-wrapper ${isContainerSpoiler ? 'd-spoiler-root' : ''}">
            <div class="d-embed-container" style="--d-accent-color: ${accentHex};">
              ${componentsHtml || '<div class="d-empty-embed">No components added yet. Add components from the left pane!</div>'}
            </div>
            ${isContainerSpoiler ? `
              <div class="d-spoiler-mask-overlay" onclick="this.parentElement.classList.toggle('revealed')">
                <span class="d-spoiler-badge-large">SPOILER</span>
              </div>
            ` : ''}
          </div>
        `;
      }

      function updatePreview() {
        const jsonText = getFormattedJson();
        jsonOutput.textContent = jsonText;

        const totalComponents = countComponents(rootContainer);
        statCount.textContent = totalComponents;
        if (totalComponents > 40) {
          statCountWrapper.classList.add('limit-exceeded');
        } else {
          statCountWrapper.classList.remove('limit-exceeded');
        }

        const bytes = new TextEncoder().encode(jsonText).length;
        statSize.textContent = bytes.toLocaleString();

        renderVisualizer();
      }

      // --- Render Component List (Editor) ---
      function renderList() {
        listContainer.innerHTML = '';
        rootContainer.components.forEach((comp, idx) => {
          const descriptor = REGISTRY[comp.type];
          if (!descriptor) return;

          const card = document.createElement('div');
          card.className = 'component-card';

          const header = `
            <div class="component-header">
              <span>#${idx + 1} - ${descriptor.name} (${comp.type})</span>
              <div class="component-actions">
                ${idx > 0 ? `<button class="btn-subtle" data-action="move" data-index="${idx}" data-dir="-1">&uarr;</button>` : ''}
                ${idx < rootContainer.components.length - 1 ? `<button class="btn-subtle" data-action="move" data-index="${idx}" data-dir="1">&darr;</button>` : ''}
                <button class="btn-danger" data-action="delete-comp" data-index="${idx}">&times;</button>
              </div>
            </div>
          `;

          card.innerHTML = header + descriptor.render(comp, `components.${idx}`);
          listContainer.appendChild(card);
        });

        updatePreview();
      }

      // --- Event Delegation ---
      listContainer.addEventListener('input', (e) => {
        const target = e.target;
        if (target.dataset.action) return;

        // Custom emoji detection for Emoji Name input
        if (target.dataset.emojiTarget) {
          const emojiBasePath = target.dataset.emojiTarget;
          const raw = target.value.trim();
          const customEmojiMatch = raw.match(/^<?(?:a)?:?([a-zA-Z0-9_-]+):(\d+)>?:?$/);

          if (customEmojiMatch) {
            const [, emojiName, emojiId] = customEmojiMatch;
            target.value = emojiName;
            setByPath(rootContainer, `${emojiBasePath}.name`, emojiName);
            setByPath(rootContainer, `${emojiBasePath}.id`, emojiId);

            const container = target.closest('.sub-item-box');
            if (container) {
              const idInput = container.querySelector(`[data-emoji-id-target="${emojiBasePath}"]`);
              if (idInput) idInput.value = emojiId;
            }
            updatePreview();
            return;
          }

          setByPath(rootContainer, `${emojiBasePath}.name`, target.value);
          updatePreview();
          return;
        }

        // Custom emoji ID input handling
        if (target.dataset.emojiIdTarget) {
          const emojiBasePath = target.dataset.emojiIdTarget;
          const raw = target.value.trim();
          const customEmojiMatch = raw.match(/^<?(?:a)?:?([a-zA-Z0-9_-]+):(\d+)>?:?$/);

          if (customEmojiMatch) {
            const [, emojiName, emojiId] = customEmojiMatch;
            target.value = emojiId;
            setByPath(rootContainer, `${emojiBasePath}.name`, emojiName);
            setByPath(rootContainer, `${emojiBasePath}.id`, emojiId);

            const container = target.closest('.sub-item-box');
            if (container) {
              const nameInput = container.querySelector(`[data-emoji-target="${emojiBasePath}"]`);
              if (nameInput) nameInput.value = emojiName;
            }
            updatePreview();
            return;
          }

          const emojiObj = getByPath(rootContainer, emojiBasePath);
          if (raw) {
            setByPath(rootContainer, `${emojiBasePath}.id`, raw);
          } else if (emojiObj) {
            delete emojiObj.id;
          }
          updatePreview();
          return;
        }

        const path = target.dataset.path;
        if (!path) return;

        let val = target.value;
        if (target.dataset.type === 'boolean') {
          val = target.checked;
        }

        setByPath(rootContainer, path, val);
        updatePreview();
      });

      listContainer.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) return;

        const action = actionBtn.dataset.action;

        if (action === 'move') {
          const idx = parseInt(actionBtn.dataset.index, 10);
          const dir = parseInt(actionBtn.dataset.dir, 10);
          const target = idx + dir;
          if (target >= 0 && target < rootContainer.components.length) {
            const temp = rootContainer.components[idx];
            rootContainer.components[idx] = rootContainer.components[target];
            rootContainer.components[target] = temp;
            renderList();
          }
        } else if (action === 'delete-comp') {
          const idx = parseInt(actionBtn.dataset.index, 10);
          rootContainer.components.splice(idx, 1);
          renderList();
        } else if (action === 'delete-array-item') {
          const path = actionBtn.dataset.path;
          const index = parseInt(actionBtn.dataset.index, 10);
          const array = getByPath(rootContainer, path);
          if (Array.isArray(array)) {
            array.splice(index, 1);
            renderList();
          }
        } else if (action === 'add-gallery-item') {
          const path = actionBtn.dataset.path;
          const comp = getByPath(rootContainer, path);
          if (comp) {
            comp.items = comp.items || [];
            comp.items.push({ media: { url: 'https://upload.wikimedia.org/wikipedia/commons/2/22/Blue-green-gradient.jpg' }, description: '', spoiler: false });
            renderList();
          }
        } else if (action === 'add-row-button') {
          const path = actionBtn.dataset.path;
          const comp = getByPath(rootContainer, path);
          if (comp) {
            comp.components = comp.components || [];
            comp.components.push({
              type: 2,
              style: 5,
              url: 'https://discord.com',
              label: 'Link',
              emoji: { name: '' },
              disabled: false
            });
            renderList();
          }
        }
      });

      listContainer.addEventListener('change', (e) => {
        const target = e.target;
        const action = target.dataset.action;

        if (action === 'change-accessory') {
          const path = target.dataset.path;
          const comp = getByPath(rootContainer, path);
          if (!comp) return;

          const val = target.value;
          if (val === 'button') {
            comp.accessory = { type: 2, style: 5, url: 'https://discord.com', label: 'Open', emoji: { name: '' } };
          } else if (val === 'thumbnail') {
            comp.accessory = { type: 11, media: { url: 'https://upload.wikimedia.org/wikipedia/commons/2/22/Blue-green-gradient.jpg' }, spoiler: false };
          } else {
            delete comp.accessory;
          }
          renderList();
        }
      });

      // --- Setup Add Toolbar from Registry ---
      Object.values(REGISTRY).forEach((desc) => {
        const btn = document.createElement('button');
        btn.className = 'btn-subtle';
        btn.textContent = `+ ${desc.name} (${desc.type})`;
        btn.addEventListener('click', () => {
          rootContainer.components.push(desc.create());
          renderList();
        });
        addToolbar.appendChild(btn);
      });

      // --- Root Container Color & Spoiler Binding ---
      function syncColor(hex) {
        colorPicker.value = hex;
        colorHex.value = hex.toUpperCase();
        rootContainer.accent_color = hexToInt(hex);
        updatePreview();
      }

      colorPicker.addEventListener('input', (e) => syncColor(e.target.value));
      colorHex.addEventListener('input', (e) => {
        if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
          syncColor(e.target.value);
        }
      });

      spoilerCheckbox.addEventListener('change', (e) => {
        rootContainer.spoiler = e.target.checked;
        updatePreview();
      });

      minifyCheckbox.addEventListener('change', updatePreview);

      btnResetSpoilers.addEventListener('click', () => {
        visualPreviewContainer.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed'));
      });

      // --- Clipboard UX Helper ---
      function handleCopy(button, textGenerator) {
        const originalText = button.textContent;
        navigator.clipboard.writeText(textGenerator()).then(() => {
          button.textContent = 'Copied!';
          setTimeout(() => { button.textContent = originalText; }, 1800);
        });
      }

      btnCopyJson.addEventListener('click', () => {
        handleCopy(btnCopyJson, () => getFormattedJson());
      });

      btnCopyScript.addEventListener('click', () => {
        handleCopy(btnCopyScript, () => {
          const json = getFormattedJson();
          return minifyCheckbox.checked
            ? `<script id="discord:component-embed" type="application/json">${json}<\/script>`
            : `<script id="discord:component-embed" type="application/json">\n${json}\n<\/script>`;
        });
      });

      // --- Import JSON Modal Logic ---
      btnOpenImport.addEventListener('click', () => {
        importJsonInput.value = '';
        importError.style.display = 'none';
        importModal.style.display = 'flex';
      });

      const closeImport = () => { importModal.style.display = 'none'; };
      btnCloseImport.addEventListener('click', closeImport);
      btnCancelImport.addEventListener('click', closeImport);

      btnApplyImport.addEventListener('click', () => {
        try {
          const text = importJsonInput.value.trim();
          if (!text) return;
          const parsed = JSON.parse(text);

          let newContainer = null;

          if (parsed?.embeds?.[0]?.components?.[0]?.type === 17) {
            newContainer = parsed.embeds[0].components[0];
          } else if (parsed?.component?.type === 17) {
            newContainer = parsed.component;
          } else if (parsed?.type === 17) {
            newContainer = parsed;
          } else if (Array.isArray(parsed?.components)) {
            newContainer = {
              type: 17,
              accent_color: parsed.accent_color ?? 5793266,
              spoiler: !!parsed.spoiler,
              components: parsed.components
            };
          }

          if (!newContainer) {
            throw new Error('Could not find a valid Type 17 Components V2 container in payload.');
          }

          rootContainer = newContainer;
          rootContainer.accent_color = rootContainer.accent_color ?? 5793266;
          rootContainer.spoiler = !!rootContainer.spoiler;
          rootContainer.components = rootContainer.components || [];

          syncColor(intToHex(rootContainer.accent_color));
          spoilerCheckbox.checked = rootContainer.spoiler;
          renderList();
          closeImport();
        } catch (err) {
          importError.textContent = err.message;
          importError.style.display = 'block';
        }
      });

      // --- Initialize UI ---
      syncColor(intToHex(rootContainer.accent_color));
      spoilerCheckbox.checked = rootContainer.spoiler;
      renderList();
    })();
  </script>
</body>
</html>
